function openSessionForm(id){
  const editing = !!id;
  const s = editing ? clone(S.sessions[id]) : {animal:'goat', goatType:'khasi', date:today(), ownerName:'', ownerPhone:'', totalQty:'', rate:defaultRate('goat','khasi'), expenses:'', note:''};
  let rateTouched = editing;
  const body = `
    <div class="field"><span class="lbl">${esc(t('animal'))}</span><div class="seg" id="fAnimal">
      ${['goat','pig','buffalo'].map(a => `<button type="button" data-a="${a}" aria-pressed="${s.animal === a}">${esc(t(a))}</button>`).join('')}</div></div>
    <div class="field" id="fGoatWrap"><span class="lbl">${esc(t('goatType'))}</span><div class="chips" id="fGoat">
      ${GOAT_TYPES.map(g => `<button type="button" class="chip" data-g="${g}" aria-pressed="${s.goatType === g}">${esc(GT[L()][g])}</button>`).join('')}</div></div>
    <div class="row2">
      <div class="field"><label for="fDate">${esc(t('date'))}</label><input id="fDate" type="date" value="${esc(s.date)}" data-nofocus="1"><span class="help" id="fDateBS">${esc(fmtBS(s.date, L()))}</span></div>
      <div class="field"><label for="fQty" id="fQtyL"></label><input id="fQty" inputmode="decimal" value="${esc(s.totalQty)}" placeholder="–"></div>
    </div>
    <span class="help muted small" style="margin-top:-8px">${esc(t('totalQtyHelp'))}</span>
    <div class="field"><label for="fRate" id="fRateL"></label><input id="fRate" inputmode="decimal" value="${esc(s.rate)}"><span class="help" id="fRateHelp">${editing ? '' : esc(t('rateFromSettings'))}</span></div>
    <div class="field" id="fBhagWrap"><label for="fTotalPrice">${esc(t('bhagHelper'))}</label><input id="fTotalPrice" inputmode="decimal" placeholder="${esc(t('totalPrice'))}"><span class="help" id="fPerBhag"></span></div>
    <div class="row2">
      <div class="field"><label for="fOwner">${esc(t('ownerName'))}</label><input id="fOwner" value="${esc(s.ownerName)}" autocomplete="off"></div>
      <div class="field"><label for="fOwnerPh">${esc(t('ownerPhone'))}</label><input id="fOwnerPh" type="tel" inputmode="tel" value="${esc(s.ownerPhone)}"></div>
    </div>
    <div class="field"><label for="fOwnerPay">${esc(t('ownerPay'))}</label><input id="fOwnerPay" value="${esc(s.ownerPay || '')}" placeholder="${esc(t('ownerPayPh'))}" autocomplete="off"></div>
    <div class="field"><label for="fExp">${esc(t('expensesOpt'))}</label><input id="fExp" inputmode="decimal" value="${esc(s.expenses)}"></div>
    <p class="err" id="fErr" hidden></p>`;
  openSheet(esc(editing ? t('editCutting') : t('newCutting')), body,
    `<button class="btn" type="button" data-close2>${esc(t('cancel'))}</button><button class="btn primary" type="button" id="fSave">${esc(t('save'))}</button>`);
  $sheet.querySelector('[data-close2]').onclick = closeSheet;
  const $ = id2 => document.getElementById(id2);
  function sync(){
    const unit = unitName(UNIT_OF[s.animal]);
    $('fQtyL').textContent = t('totalQty', unit);
    $('fRateL').textContent = t('ratePer', unit);
    $('fGoatWrap').hidden = s.animal !== 'goat';
    $('fBhagWrap').hidden = s.animal !== 'buffalo';
    $sheet.querySelectorAll('#fAnimal button').forEach(b => b.setAttribute('aria-pressed', b.dataset.a === s.animal));
    $sheet.querySelectorAll('#fGoat button').forEach(b => b.setAttribute('aria-pressed', b.dataset.g === s.goatType));
    if (!rateTouched){ $('fRate').value = defaultRate(s.animal, s.goatType) || ''; }
  }
  $sheet.querySelectorAll('#fAnimal button').forEach(b => b.onclick = () => { s.animal = b.dataset.a; sync(); });
  $('fDate').oninput = () => { $('fDateBS').textContent = $('fDate').value ? fmtBS($('fDate').value, L()) : ''; };
  $sheet.querySelectorAll('#fGoat button').forEach(b => b.onclick = () => { s.goatType = b.dataset.g; sync(); });
  $('fRate').oninput = () => { rateTouched = true; $('fRateHelp').textContent = ''; };
  function bhagCalc(){
    const tp = num($('fTotalPrice').value), n = num($('fQty').value);
    if (tp > 0 && n > 0){ const per = Math.round(tp / n); $('fRate').value = per; rateTouched = true; $('fRateHelp').textContent = ''; $('fPerBhag').textContent = t('perBhagIs', money(per)); }
    else $('fPerBhag').textContent = '';
  }
  $('fTotalPrice').oninput = bhagCalc; $('fQty').addEventListener('input', () => { if (s.animal === 'buffalo' && $('fTotalPrice').value) bhagCalc(); });
  sync();
  $('fSave').onclick = () => {
    const rate = num($('fRate').value);
    if (!(rate > 0)){ $('fErr').hidden = false; $('fErr').textContent = t('ratePer', unitName(UNIT_OF[s.animal])); return; }
    const out = Object.assign(editing ? S.sessions[id] : {entries:[], createdAt:Date.now()}, {
      animal:s.animal, goatType:s.animal === 'goat' ? s.goatType : '', date:$('fDate').value || today(),
      ownerName:$('fOwner').value.trim(), ownerPhone:phoneIn($('fOwnerPh').value), ownerPay:$('fOwnerPay').value.trim(),
      totalQty:$('fQty').value.trim() === '' ? '' : num($('fQty').value), rate, expenses:$('fExp').value.trim() === '' ? '' : num($('fExp').value)
    });
    const newId = id || uid(); S.sessions[newId] = out; saveSession(newId);
    closeSheet(); S.view = 'session'; S.sid = newId; S.filter = 'all'; render(); toast(t('saved'));
  };
}

/* ---------- Entry form ---------- */
function openEntryForm(sid, eid){
  const s = S.sessions[sid]; const unit = UNIT_OF[s.animal];
  const editing = !!eid; const src = editing ? (s.entries || []).find(e => e.id === eid) : null;
  const e = src ? clone(src) : {name:'', phone:'', qty:'', paid:0, method:'cash', note:''};
  const custom = e.amt !== undefined && e.amt !== null && e.amt !== '';
  let st0 = editing ? entryStatus(s, e) : 'unpaid'; if (st0 === 'nomeat') st0 = 'unpaid';
  const weighed = isWeighed(s); const w0 = wantOf(e);
  const chips = {kg:[0.5,1,1.5,2,2.5,3], dharni:[0.25,0.5,0.75,1,1.5,2], bhag:[0.5,1,1.5,2]}[unit];
  const names = Object.values(S.contacts).map(c => `<option value="${esc(c.name)}"></option>`).join('');
  const body = `
    <div class="field"><label for="eName">${esc(t('name'))}</label><input id="eName" list="eNames" value="${esc(e.name)}" autocomplete="off"><datalist id="eNames">${names}</datalist></div>
    <div class="field"><label for="ePhone">${esc(t('phone'))}</label><input id="ePhone" type="tel" inputmode="tel" value="${esc(e.phone)}" placeholder="98XXXXXXXX"></div>
    <div class="field"><label for="eQty">${esc(weighed ? t('getsLabel', unitName(unit)) : t('wantsLabel', unitName(unit)))}</label><input id="eQty" inputmode="decimal" value="${esc(e.qty)}" placeholder="–"><span class="help">${weighed && w0 > 0 ? esc(t('ordered') + ': ' + qtyText(w0, unit)) : esc(t('meatOptional'))}</span>
      <div class="chips" id="eChips">${chips.map(c => `<button type="button" class="chip" data-q="${c}">${esc(dig(qtyNum(c, unit)))}</button>`).join('')}</div></div>
    <div class="calc"><span id="eCalcL"></span><span id="eCalc"></span></div>
    <label class="small" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="eCustom" ${custom ? 'checked' : ''}> ${esc(t('customAmount'))}</label>
    <div class="field" id="eAmtWrap" ${custom ? '' : 'hidden'}><label for="eAmt">${esc(t('amount'))} (Rs.)</label><input id="eAmt" inputmode="decimal" value="${custom ? esc(e.amt) : ''}"></div>
    <p class="muted small" id="eNoPay" style="margin:0">${esc(t('payAfterMeat'))}</p>
    <div id="ePayBox" class="sec">
      <span class="lbl muted small" style="font-weight:700">${esc(t('payments'))}</span>
      <div id="ePayList" class="sec" style="gap:6px"></div>
      <div class="card sec" style="background:var(--bg);gap:10px">
        <div class="row2">
          <div class="field"><label for="ePayAmt">${esc(t('payAmount'))}</label><input id="ePayAmt" inputmode="decimal" autocomplete="off"></div>
          <div class="field"><label for="ePayMeth">${esc(t('method'))}</label><select id="ePayMeth">${['cash','esewa','khalti','bank'].map(m => `<option value="${m}">${esc(t(m))}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label for="ePayDate">${esc(t('date'))}</label><input id="ePayDate" type="date" value="${today()}" data-nofocus="1"><span class="help" id="ePayDateBS"></span></div>
        <div class="btn-row"><button class="btn" type="button" id="ePayAdd">${esc(t('addPayment'))}</button><button class="btn good" type="button" id="ePayFull">✓ ${esc(t('paidFull'))}</button></div>
      </div>
    </div>
    <div class="field"><label for="eNote">${esc(t('note'))}</label><input id="eNote" value="${esc(e.note || '')}"></div>
    <p class="err" id="eErr" hidden></p>`;
  openSheet(esc(editing ? e.name : t('addPerson')), body,
    (editing ? `<button class="btn danger" type="button" id="eDel">${esc(t('del'))}</button>` : `<button class="btn" type="button" data-close2>${esc(t('cancel'))}</button>`) +
    (editing && weighed && entryDue(s, src) > 0 ? `<button class="btn" type="button" id="eRemind">${esc(t('remind'))}</button>` : '') +
    `<button class="btn primary" type="button" id="eSave">${esc(t('save'))}</button>`);
  const $ = id2 => document.getElementById(id2);
  const c2 = $sheet.querySelector('[data-close2]'); if (c2) c2.onclick = closeSheet;
  const rm = $('eRemind'); if (rm) rm.onclick = () => openSender(t('remindTitle'), [{name:src.name, phone:src.phone, msg:msgEntry(s, src)}]);
  let pays = clone(paymentsOf(e));
  function amount(){ return $('eCustom').checked && $('eAmt').value.trim() !== '' ? Math.round(num($('eAmt').value)) : Math.round(num($('eQty').value) * num(s.rate)); }
  function calc(){
    $('eCalcL').textContent = $('eCustom').checked ? t('amount') : `${qtyText(num($('eQty').value), unit)} × ${money(s.rate)}`;
    $('eCalc').textContent = money(amount());
    $sheet.querySelectorAll('#eChips .chip').forEach(b => b.setAttribute('aria-pressed', num(b.dataset.q) === num($('eQty').value) && $('eQty').value !== ''));
    const meat = amount() > 0 && weighed; $('ePayBox').hidden = !meat; $('eNoPay').hidden = meat;
    drawPays();
  }
  function paidSum(){ return pays.reduce((a, x) => a + num(x.amt), 0); }
  function drawPays(){
    const due = Math.max(0, amount() - paidSum());
    $('ePayList').innerHTML = (pays.length ? pays.map((x, i) => `<div class="mrow"><span class="small">${esc(x.date ? fmtDate(x.date) : t('earlier'))} · ${esc(t(x.method || 'cash'))}</span><span style="display:flex;gap:8px;align-items:center"><b class="num">${esc(money(x.amt))}</b><button class="btn sm" type="button" data-rmpay="${i}" aria-label="${esc(t('del'))}">×</button></span></div>`).join('')
      : `<p class="muted small" style="margin:0">${esc(t('noPayments'))}</p>`)
      + `<div class="mrow total"><span>${esc(t('paid'))}</span><b class="num" style="color:var(--good)">${esc(money(paidSum()))}</b></div>`
      + `<div class="mrow"><span>${esc(t('due'))}</span><b class="num" style="color:${due > 0 ? 'var(--bad)' : 'var(--good)'}">${esc(money(due))}</b></div>`;
    $('ePayAmt').placeholder = due > 0 ? String(due) : '0';
    $('ePayFull').disabled = !(due > 0);
    $('ePayList').querySelectorAll('[data-rmpay]').forEach(b => b.onclick = () => { pays.splice(+b.dataset.rmpay, 1); commitPays(); });
  }
  function commitPays(){
    // payments are saved at once so nothing is lost if the sheet is closed
    if (src){ setPayments(src, pays); saveSession(sid); render(); toast(t('paymentSaved')); }
    drawPays();
  }
  $('ePayDate').oninput = () => { $('ePayDateBS').textContent = $('ePayDate').value ? fmtBS($('ePayDate').value, L()) : ''; };
  $('ePayDateBS').textContent = fmtBS(today(), L());
  $('ePayAdd').onclick = () => {
    const v = Math.round(num($('ePayAmt').value)); if (!(v > 0)){ $('ePayAmt').focus(); toast(t('enterAmount')); return; }
    pays.push({amt:v, method:$('ePayMeth').value, date:$('ePayDate').value || today()}); $('ePayAmt').value = ''; commitPays();
  };
  $('ePayFull').onclick = () => {
    const due = Math.max(0, amount() - paidSum()); if (!(due > 0)) return;
    pays.push({amt:due, method:$('ePayMeth').value, date:$('ePayDate').value || today()}); commitPays();
  };
  $('eQty').oninput = calc; $('eAmt').oninput = calc;
  $('eCustom').onchange = () => { $('eAmtWrap').hidden = !$('eCustom').checked; if ($('eCustom').checked && !$('eAmt').value) $('eAmt').value = Math.round(num($('eQty').value) * num(s.rate)) || ''; calc(); };
  $sheet.querySelectorAll('#eChips .chip').forEach(b => b.onclick = () => { $('eQty').value = b.dataset.q; calc(); });
  $('eName').addEventListener('input', () => {
    const hit = findContactByName($('eName').value);
    if (hit && !$('ePhone').value && hit[1].phone) $('ePhone').value = hit[1].phone;
  });
  calc();
  $('eSave').onclick = () => {
    const name = $('eName').value.trim(), qty = num($('eQty').value);
    const err = $('eErr');
    if (!name){ err.hidden = false; err.textContent = t('nameReq'); return; }
    const phone = phoneIn($('ePhone').value);
    const out = {id:eid || uid(), cid:ensureContact(name, phone), name, phone, qty:qty > 0 ? qty : ''};
    out.want = weighed ? (w0 > 0 ? w0 : out.qty) : out.qty;
    if ($('eCustom').checked && $('eAmt').value.trim() !== '') out.amt = Math.round(num($('eAmt').value));
    setPayments(out, (amount() > 0 && weighed) ? pays : []);
    const note = $('eNote').value.trim(); if (note) out.note = note;
    s.entries = s.entries || [];
    const idx = s.entries.findIndex(x => x.id === out.id);
    if (idx >= 0) s.entries[idx] = Object.assign({}, s.entries[idx], out); else s.entries.push(out);
    if (!out.note && idx >= 0) delete s.entries[idx].note;
    if (out.amt === undefined && idx >= 0) delete s.entries[idx].amt;
    saveSession(sid); closeSheet(); render(); toast(t('saved'));
  };
  const del = $('eDel'); if (del) del.onclick = () => {
    s.entries = (s.entries || []).filter(x => x.id !== eid); saveSession(sid); closeSheet(); render();
  };
}

/* ---------- Add many names at once ---------- */
function openBulkAdd(sid){
  const s = S.sessions[sid];
  const inList = new Set((s.entries || []).map(e => e.cid));
  const saved = Object.entries(S.contacts).filter(([id]) => !inList.has(id))
    .sort((a, b) => (a[1].name || '').localeCompare(b[1].name || ''));
  const last = sessionList().find(x => x.id !== sid && (x.entries || []).length);
  const lastIds = new Set(last ? last.entries.map(e => e.cid) : []);
  const lastHas = saved.some(([id]) => lastIds.has(id));
  const opts = Object.values(S.contacts).map(c => `<option value="${esc(c.name)}"></option>`).join('');
  const body = `
    <p class="muted small" style="margin:0">${esc(t('namesHelp'))}</p>
    <div class="field"><span class="lbl">${esc(t('newNames'))}</span>
      <div id="bRows" class="sec" style="gap:8px"></div><datalist id="bNames">${opts}</datalist>
      <button class="btn sm" type="button" id="bAddRow" style="align-self:flex-start">${esc(t('addRow'))}</button></div>
    ${saved.length ? `<div class="field"><span class="lbl">${esc(t('savedPeople'))}</span>
      <div class="chips">${lastHas ? `<button class="chip" type="button" id="bLast">${esc(t('fromLast'))}</button>` : ''}<button class="chip" type="button" id="bClear">${esc(t('clearPick'))}</button></div>
      <div class="pick" id="bPick">${saved.map(([id, c]) => `<label><input type="checkbox" value="${esc(id)}"><span class="pn">${esc(c.name)}</span><span class="pp">${esc(c.phone || '')}</span></label>`).join('')}</div></div>`
      : (Object.keys(S.contacts).length ? `<p class="muted small" style="margin:0">${esc(t('allSaved'))}</p>` : '')}
    <p class="err" id="bErr" hidden></p>`;
  openSheet(esc(t('addNames')), body,
    `<button class="btn" type="button" data-close2>${esc(t('cancel'))}</button><button class="btn primary" type="button" id="bSave"></button>`);
  const $ = id2 => document.getElementById(id2);
  $sheet.querySelector('[data-close2]').onclick = closeSheet;
  const rowsEl = $('bRows');
  function typed(){
    const seen = new Set(), out = [];
    rowsEl.querySelectorAll('.bulk-card').forEach(r => {
      const n = r.querySelector('.bn').value.trim(), p = phoneIn(r.querySelector('.bp').value), w = num(r.querySelector('.bwi').value.replace(',', '.'));
      if (n && !seen.has(n.toLowerCase())){ seen.add(n.toLowerCase()); out.push({name:n, phone:p, want:w > 0 ? w : ''}); }
    });
    return out;
  }
  function picked(){ return [...$sheet.querySelectorAll('#bPick input:checked')].map(i => i.value); }
  function count(){ const n = typed().length + picked().length; $('bSave').textContent = t('addN', n).replace(/\d+/g, d => dig(d)); return n; }
  function addRow(focus){
    const r = document.createElement('div'); r.className = 'bulk-card';
    const u = unitName(UNIT_OF[s.animal]);
    r.innerHTML = `<input class="bn" list="bNames" autocomplete="off" enterkeyhint="next" placeholder="${esc(t('nameCol'))}" aria-label="${esc(t('name'))}"><input class="bp" type="tel" inputmode="tel" enterkeyhint="next" placeholder="${esc(t('phoneOpt'))}" aria-label="${esc(t('phone'))}"><span class="bw"><input class="bwi" inputmode="decimal" enterkeyhint="next" placeholder="${esc(t('wantsCol'))}" aria-label="${esc(t('wantsLabel', u))}"><span>${esc(u)}</span></span><button class="btn x" type="button" aria-label="${esc(t('del'))}">×</button>`;
    const bn = r.querySelector('.bn'), bp = r.querySelector('.bp'), bw = r.querySelector('.bwi');
    bn.addEventListener('input', () => { const hit = findContactByName(bn.value); if (hit && !bp.value && hit[1].phone) bp.value = hit[1].phone; count(); });
    bn.addEventListener('keydown', ev => { if (ev.key === 'Enter'){ ev.preventDefault(); bp.focus(); } });
    bp.addEventListener('keydown', ev => { if (ev.key === 'Enter'){ ev.preventDefault(); bw.focus(); } });
    bw.addEventListener('keydown', ev => {
      if (ev.key !== 'Enter') return; ev.preventDefault();
      const next = r.nextElementSibling; if (next) next.querySelector('.bn').focus(); else addRow(true);
    });
    r.querySelector('.x').onclick = () => { if (rowsEl.children.length > 1) r.remove(); else { bn.value = ''; bp.value = ''; } count(); };
    rowsEl.appendChild(r); if (focus) bn.focus();
  }
  for (let i = 0; i < 3; i++) addRow(false);
  $('bAddRow').onclick = () => addRow(true);
  $sheet.querySelectorAll('#bPick input').forEach(i => i.onchange = count);
  const bl = $('bLast'); if (bl) bl.onclick = () => { $sheet.querySelectorAll('#bPick input').forEach(i => { if (lastIds.has(i.value)) i.checked = true; }); count(); };
  const bc = $('bClear'); if (bc) bc.onclick = () => { $sheet.querySelectorAll('#bPick input').forEach(i => { i.checked = false; }); count(); };
  count();
  setTimeout(() => { try { rowsEl.querySelector('.bn').focus({preventScroll:true}); } catch (e) {} }, 80);
  $('bSave').onclick = () => {
    if (!count()){ $('bErr').hidden = false; $('bErr').textContent = t('noNamesGiven'); return; }
    s.entries = s.entries || [];
    const have = new Set(s.entries.map(e => e.cid)); let added = 0, skipped = 0;
    const push = (cid, name, phone, want) => {
      if (have.has(cid)){ skipped++; return; }
      have.add(cid); added++;
      s.entries.push({id:uid(), cid, name, phone:phone || '', want:want || '', qty:want || '', paid:0});
    };
    typed().forEach(x => { const cid = ensureContact(x.name, x.phone); const c = S.contacts[cid]; push(cid, c.name, x.phone || c.phone, x.want); });
    picked().forEach(cid => { const c = S.contacts[cid]; if (c) push(cid, c.name, c.phone); });
    if (added) saveSession(sid);
    closeSheet(); S.filter = 'all'; render();
    toast(dig(t('added', added)) + (skipped ? ' · ' + dig(t('skipped', skipped)) : ''));
  };
}

/* ---------- Contact form ---------- */
function openPerson(cid){
  const c = cid ? S.contacts[cid] : {name:'', phone:''};
  const items = cid ? personItems(cid) : [];
  const due = items.reduce((a, i) => a + i.due, 0);
  const list = items.map(i => {
    const unit = UNIT_OF[i.s.animal];
    const nm = !hasMeat(i.e);
    return `<div class="mrow"><span>${esc(fmtDate(i.s.date))} · ${esc(animalTitle(i.s))}${nm ? '' : ' · ' + esc(qtyText(i.e.qty, unit))}</span>${nm ? `<span class="pill neutral">${esc(t('noMeatYet'))}</span>` : i.due > 0 ? `<b style="color:var(--bad)">${esc(money(i.due))}</b>` : `<span class="pill good">${esc(t('paid'))}</span>`}</div>`;
  }).join('');
  const body = `
    <div class="row2"><div class="field"><label for="cName">${esc(t('name'))}</label><input id="cName" value="${esc(c.name)}" autocomplete="off"></div>
    <div class="field"><label for="cPhone">${esc(t('phone'))}</label><input id="cPhone" type="tel" inputmode="tel" value="${esc(c.phone)}" placeholder="98XXXXXXXX"></div></div>
    ${items.length ? `<div class="card money"><div class="lbl muted small" style="font-weight:700">${esc(t('personDues'))}</div>${list}<div class="mrow total bad"><span>${esc(t('due'))}</span><b>${esc(money(due))}</b></div></div>` : ''}
    ${due > 0 ? `<button class="btn block" type="button" id="cRemind">${esc(t('remindAllDues'))}</button>` : ''}
    <p class="err" id="cErr" hidden></p>`;
  openSheet(esc(cid ? t('editContact') : t('addContact')), body,
    (cid ? `<button class="btn danger" type="button" id="cDel">${esc(t('deleteContact'))}</button>` : `<button class="btn" type="button" data-close2>${esc(t('cancel'))}</button>`) +
    `<button class="btn primary" type="button" id="cSave">${esc(t('save'))}</button>`);
  const $ = id2 => document.getElementById(id2);
  const c2 = $sheet.querySelector('[data-close2]'); if (c2) c2.onclick = closeSheet;
  $('cSave').onclick = () => {
    const name = $('cName').value.trim(); if (!name){ $('cErr').hidden = false; $('cErr').textContent = t('nameReq'); return; }
    const phone = phoneIn($('cPhone').value); const id = cid || uid();
    const prev = S.contacts[id] || {createdAt:Date.now()};
    S.contacts[id] = Object.assign({}, prev, {name, phone}); saveContact(id);
    // keep names and phones on records in step
    if (cid) Object.entries(S.sessions).forEach(([sid, s]) => {
      let ch = false; (s.entries || []).forEach(e => { if (e.cid === cid && (e.name !== name || e.phone !== phone)){ e.name = name; e.phone = phone; ch = true; } });
      if (ch) saveSession(sid);
    });
    closeSheet(); render(); toast(t('saved'));
  };
  const del = $('cDel'); if (del) del.onclick = () => {
    if (items.length){ $('cErr').hidden = false; $('cErr').textContent = t('cannotDelete'); return; }
    delete S.contacts[cid]; saveContact(cid); closeSheet(); render();
  };
  const rem = $('cRemind'); if (rem) rem.onclick = () => {
    const fresh = Object.assign({}, c, {name:$('cName').value.trim() || c.name});
    openSender(t('remindTitle'), [{name:fresh.name, phone:phoneIn($('cPhone').value) || c.phone, msg:msgPerson(fresh, items)}]);
  };
}

/* ---------- Sending messages ---------- */
function openSender(title, queue){
  let i = 0;
  function show(){
    const item = queue[i]; const multi = queue.length > 1;
    const body = `
      ${multi ? `<span class="pill neutral" style="align-self:flex-start">${esc(dig(t('ofN', i + 1, queue.length)))}</span>` : ''}
      ${item.share ? '' : `<div class="mrow"><span><b>${esc(item.name)}</b></span><span class="num">${item.phone ? esc(item.phone) : ''}</span></div>`}
      ${item.phone || item.share ? '' : `<p class="err" style="margin:0">${esc(t('noPhone'))}</p>`}
      <div class="field"><label for="mText">${esc(t('message'))}</label><textarea id="mText" data-nofocus="1" rows="7">${esc(item.msg)}</textarea></div>
      <div class="send-row">
        <a class="btn primary" id="mSms" target="_blank" rel="noopener">${esc(t('sms'))}</a>
        <a class="btn good" id="mWa" target="_blank" rel="noopener">${esc(t('whatsapp'))}</a>
        <button class="btn" type="button" id="mCopy">${esc(t('copy'))}</button>
      </div>
      <p class="muted small" style="margin:0">${esc(t('opensApp'))}</p>`;
    openSheet(esc(title), body, multi
      ? `<button class="btn" type="button" id="mDone">${esc(t('done'))}</button>${i < queue.length - 1 ? `<button class="btn primary" type="button" id="mNext">${esc(t('next'))} ›</button>` : ''}`
      : '');
    const ta = document.getElementById('mText'), sms = document.getElementById('mSms'), wa = document.getElementById('mWa');
    function links(){
      item.msg = ta.value;
      if (item.phone){ sms.href = smsHref(item.phone, ta.value); sms.removeAttribute('aria-disabled'); sms.style.opacity = ''; }
      else { sms.removeAttribute('href'); sms.setAttribute('aria-disabled', 'true'); sms.style.opacity = '.45'; }
      wa.href = item.phone ? waHref(item.phone, ta.value) : `https://wa.me/?text=${encodeURIComponent(ta.value)}`;
    }
    ta.oninput = links; links();
    document.getElementById('mCopy').onclick = () => copyText(ta.value, ta);
    const nx = document.getElementById('mNext'); if (nx) nx.onclick = () => { i++; show(); };
    const dn = document.getElementById('mDone'); if (dn) dn.onclick = closeSheet;
  }
  show();
}

/* ---------- Clicks ---------- */
$main.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act; const sid = S.sid; const s = S.sessions[sid];
  switch (act){
    case 'new-session': openSessionForm(null); break;
    case 'load-example': loadExample(); break;
    case 'open-session': S.view = 'session'; S.sid = b.dataset.id; S.filter = 'all'; render(); window.scrollTo(0, 0); break;
    case 'go-home': S.view = 'home'; render(); window.scrollTo(0, 0); break;
    case 'edit-session': openSessionForm(sid); break;
    case 'add-entry': openEntryForm(sid, null); break;
    case 'add-names': openBulkAdd(sid); break;
    case 'adjust': if (adjustShares(s)){ saveSession(sid); render(); toast(t('adjusted')); } break;
    case 'reset-orders': resetShares(s); saveSession(sid); render(); toast(t('restored2')); break;
    case 'tick': {
      const e = (s.entries || []).find(x => x.id === b.dataset.eid); if (!e) break;
      if (!isWeighed(s)){ toast(t('weighFirst')); const a = document.getElementById('actualQty'); if (a) a.focus(); break; }
      if (!hasMeat(e)){ toast(t('addMeatFirst')); const q = document.getElementById('q-' + e.id); if (q) q.focus(); break; }
      if (entryStatus(s, e) === 'paid'){ setPayments(e, paymentsOf(e).slice(0, -1)); toast(entryPaid(e) > 0 ? t('lastPayRemoved') : t('markedUnpaid')); }
      else { setPayments(e, paymentsOf(e).concat([{amt:entryDue(s, e), method:'cash', date:today()}])); toast(t('markedPaid')); }
      saveSession(sid); render(); break;
    }
    case 'edit-entry': openEntryForm(sid, b.dataset.eid); break;
    case 'filter': S.filter = b.dataset.f; render(); break;
    case 'mark-paid': {
      const e = (s.entries || []).find(x => x.id === b.dataset.eid); if (!e) break;
      e.paid = entryAmt(s, e); if (!e.method) e.method = 'cash'; saveSession(sid); render(); toast(t('saved')); break;
    }
    case 'remind-entry': {
      const e = (s.entries || []).find(x => x.id === b.dataset.eid); if (!e) break;
      openSender(t('remindTitle'), [{name:e.name, phone:e.phone, msg:msgEntry(s, e)}]); break;
    }
    case 'remind-all': {
      const q = (s.entries || []).filter(e => entryDue(s, e) > 0).map(e => ({name:e.name, phone:e.phone, msg:msgEntry(s, e)}));
      if (q.length) openSender(t('remindTitle'), q); break;
    }
    case 'share-summary': openSender(t('summaryTitle'), [{name:s.ownerName || t('owner'), phone:s.ownerPhone, msg:msgSummary(s)}]); break;
    case 'delete-session': confirmBox(t('confirmDeleteCutting'), t('del'), () => { delete S.sessions[sid]; saveSession(sid); S.view = 'home'; render(); }); break;
    case 'add-contact': openPerson(null); break;
    case 'open-person': openPerson(b.dataset.id); break;
  }
});
$main.addEventListener('change', ev => {
  const inp = ev.target.closest('[data-qty]'); if (!inp) return;
  const s = S.sessions[S.sid]; const e = s && (s.entries || []).find(x => x.id === inp.dataset.qty); if (!e) return;
  const v = inp.value.trim().replace(',', '.'); const q = v === '' ? '' : num(v);
  if (q !== '' && !(q > 0)){ inp.value = e.qty ?? ''; return; }
  if (String(q) === String(e.qty ?? '')) return;
  if (!isWeighed(s)){ e.want = q; e.qty = q; }
  else { if (e.want === undefined || e.want === null || e.want === '') e.want = e.qty === '' ? q : num(e.qty); e.qty = q; }
  saveSession(S.sid); render();
});
$main.addEventListener('change', ev => {
  const inp = ev.target.closest('[data-actual]'); if (!inp) return;
  const s = S.sessions[S.sid]; if (!s) return;
  const v = inp.value.trim().replace(',', '.'); const q = v === '' ? '' : num(v);
  if (q !== '' && !(q > 0)){ inp.value = s.totalQty ?? ''; return; }
  if (String(q) === String(s.totalQty ?? '')) return;
  if (q !== '') freezeOrders(s);
  s.totalQty = q; saveSession(S.sid); render();
});
$main.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('[data-actual]')){ ev.preventDefault(); ev.target.blur(); return; }
  const inp = ev.target.closest('[data-qty]'); if (!inp || ev.key !== 'Enter') return;
  ev.preventDefault();
  const all = [...$main.querySelectorAll('[data-qty]')]; const nxt = all[all.indexOf(inp) + 1]; const nid = nxt ? nxt.id : null;
  inp.blur();
  if (nid){ const n = document.getElementById(nid); if (n){ n.focus(); try { n.select(); } catch (e) {} } }
});
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { S.view = b.dataset.tab; render(); window.scrollTo(0, 0); });
document.getElementById('langBtn').onclick = () => { S.settings.lang = L() === 'ne' ? 'en' : 'ne'; saveSettings(); render(); };

function backupObject(withPhotos){
  const sales = {}; Object.entries(SL.list).forEach(([id, r]) => { const c = Object.assign({}, r); if (!withPhotos) delete c.photos; sales[id] = c; });
  return {app:'masu-hisab', v:2, savedAt:new Date().toISOString(), settings:S.settings, sessions:S.sessions, contacts:S.contacts, sales};
}
async function saveBackupFile(){
  const name = 'masu-hisab-backup-' + today() + '.json';
  const blob = new Blob([JSON.stringify(backupObject(true))], {type:'application/json'});
  try {
    const file = new File([blob], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function readBackupFile(file){
  try { const txt = await file.text(); const ta = document.getElementById('restoreTa'); ta.value = txt; document.getElementById('restoreBtn').click(); }
  catch (e) { toast(t('restoreError')); }
}

name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the signing password secret is set
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "::error title=Signing password missing::Add the repository secret KS_PASS (Settings > Secrets and variables > Actions), then run this workflow again."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy the web app into the Android project
        run: |
          mkdir -p app/www
          cp index.html manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png app/www/

      - name: Create the Android project
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Icons, camera permission, version and signing
        run: python3 app/prepare_android.py

      - name: Build the signed APK
        working-directory: app/android
        env:
          KS_FILE: ${{ github.workspace }}/app/masu-hisab.keystore
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/masu-hisab.apk"

      - name: Publish the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Masu Hisab 1.${{ github.run_number }}
          body: |
            Android app for Masu Hisab (मासु हिसाब).
            Direct download: https://github.com/Saroj010/masu-hisab/releases/latest/download/masu-hisab.apk
          files: masu-hisab.apk
          make_latest: true
